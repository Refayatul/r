name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (pinned)
        run: python -m pip install -q pytest==8.3.4
      - name: Unit tests (frame contract, manifest hygiene)
        run: python -m pytest -q tests
