name: census-1

# Pre-registered census run for the modesty gate. Runs ONLY on workflow_dispatch.
# Nothing here reads owner labels, marks, strata or query text: the committed manifest holds
# clip keys, public preview URLs and opaque query ids only, and harness.manifest.assert_hygiene
# fails the build if that ever stops being true.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'calibration | score | aggregate'
        required: true
        default: 'calibration'
      chunk:
        description: 'chunk index for stage=score (0-based)'
        required: false
        default: '0'

concurrency:
  group: census1-${{ github.ref }}
  cancel-in-progress: false

env:
  # pinned on purpose: the whole point of the census is that the numbers are reproducible
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  FREEPIK_REVISION: 15b85477e4fd2000db76ae9aae0f89a72f95e2e3
  MARQO_REVISION: 0c26ec22111b83f106d72a55f611ec35962bcb65
  SIGLIP_REVISION: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
  MIN_COVERAGE: '0.98'

jobs:
  calibration:
    if: ${{ github.event.inputs.stage == 'calibration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # label text and reference maxima are repository secrets: never echoed, never in artifacts
      MODESTY_LABEL: ${{ secrets.MODESTY_LABEL }}
      CENSUS_REF_SCORES: ${{ secrets.CENSUS_REF_SCORES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache Hugging Face models (pinned revisions)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-freepik-15b85477-marqo-0c26ec22-siglip2-75de2d55
      - run: python -m pip install -q -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Calibrate (200 frames, 3 models) - seconds/frame only
        run: python score_nsfw.py --manifest manifest_calibration.json --limit-clips 50 --models freepik,marqo,siglip --report-timing-only
      - name: Cross-check 113 clips (14 anchors + 108 runner clips) against local maxima at 1e-3
        run: python score_nsfw.py --manifest manifest_calibration.json --models freepik,marqo,siglip --cross-check-ref CENSUS_REF_SCORES --tolerance 1e-3 --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census1-calibration
          path: |
            out/calibration.json
            out/cross_check.json
          retention-days: 7

  preflight:
    if: ${{ github.event.inputs.stage == 'score' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HEAD-check every preview URL (no downloads, no API key)
        run: python score_nsfw.py --manifest manifest_u.json --preflight --fail-on-missing-fraction 0.30
      - uses: actions/upload-artifact@v4
        with:
          name: census1-preflight-${{ github.event.inputs.chunk }}
          path: out/preflight_${{ github.event.inputs.chunk }}.json
          retention-days: 7

  score:
    if: ${{ github.event.inputs.stage == 'score' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: Score chunk ${{ matrix.chunk }} (cascade, 20% audit, 8 chunks)
        run: |
          python score_nsfw.py \
            --manifest manifest_u.json \
            --chunk ${{ matrix.chunk }} --chunks 8 \
            --models freepik,marqo,siglip \
            --cascade-cos 0.03 --cascade-marqo 0.9 \
            --audit-fraction 0.20 --audit-salt census-u \
            --video-budget-mb 90 \
            --out out/chunk_${{ matrix.chunk }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census1-chunk-${{ matrix.chunk }}
          path: out/chunk_${{ matrix.chunk }}/scores.json
          retention-days: 7

  aggregate:
    if: ${{ github.event.inputs.stage == 'aggregate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: census1-chunk-*
          merge-multiple: true
          path: out
      - name: Merge chunks and report aggregate counts only
        run: python score_nsfw.py --aggregate out --out out/census1_scores.jsonl
      - name: Coverage gate
        run: python score_nsfw.py --coverage-gate out --min-coverage $MIN_COVERAGE
      - uses: actions/upload-artifact@v4
        with:
          name: census1-scores
          path: |
            out/census1_scores.jsonl
            out/coverage.json
          retention-days: 7
